name: Checks

# Runs on every pull request (and on main after a merge) so a change that
# breaks types, lint, or the production build is caught before members
# ever see it. Vercel still builds previews and production separately;
# this just makes the failure visible on the PR itself.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR makes the older run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        # Warnings fail too, so new problems can't pile up unnoticed.
        run: npx eslint --max-warnings=0 .

      - name: Production build
        run: npx next build
        env:
          # The build only needs these to exist -- nothing is fetched from
          # Supabase at build time -- so placeholders keep real values out
          # of CI.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
